name: Garantir grupo do produto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  column:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Criar a coluna no minimercado
        run: node scripts/ensure-product-price-group.mjs
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
