name: Backup dos bancos

on:
  schedule:
    # 12:00 e 20:00 no horário de Brasília (UTC-3)
    - cron: "0 15,23 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Instalar o cliente do Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - uses: actions/cache/restore@v4
        with:
          path: .backup-state.json
          key: database-backup-state-${{ github.run_id }}
          restore-keys: database-backup-state-

      - name: Atualizar as cópias se houve mudança
        run: node scripts/database-backup.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: icy-tooth-60717071
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          BACKUP_STATE_PATH: .backup-state.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .backup-state.json
          key: database-backup-state-${{ github.run_id }}
